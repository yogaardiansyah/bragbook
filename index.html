<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BragBook — Private Work Journal, Kanban & Meeting Copilot</title>
    <meta
      name="description"
      content="100% Local-First, Zero-Server Work Journal, Kanban Board, Live Meeting Notes with Timestamping, and Standup Copilot."
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div class="app-layout">
      <!-- Header -->
      <header class="app-header">
        <div class="brand-wrapper">
          <div class="brand-logo" aria-hidden="true">📖</div>
          <div>
            <h1 class="brand-title">BragBook</h1>
          </div>
          <span class="brand-badge">Local-First</span>
        </div>

        <div class="header-metrics">
          <div class="metric-pill streak" title="Consecutive active work days">
            <span>🔥</span>
            <strong id="streak-counter">0</strong>
            <span>day streak</span>
          </div>
          <div class="metric-pill" title="Accomplishments marked as Done">
            <span>🏆</span>
            <strong id="wins-counter">0</strong>
            <span>accomplishments</span>
          </div>
        </div>

        <div class="header-actions">
          <button
            id="btn-open-standup"
            class="btn btn-primary btn-sm"
            title="Generate Daily Standup Draft"
          >
            <span>⚡</span> Standup Copilot
          </button>
          <button
            id="btn-open-settings"
            class="btn btn-secondary btn-icon"
            title="AI & App Settings"
            aria-label="Settings"
          >
            ⚙️
          </button>
          <button
            id="btn-open-backup"
            class="btn btn-secondary btn-icon"
            title="Backup & Restore Data"
            aria-label="Backup and Restore"
          >
            💾
          </button>
        </div>
      </header>

      <!-- Main Navigation Tab Switcher -->
      <nav class="tab-navigation" role="tablist" aria-label="Primary navigation">
        <button
          id="tab-btn-journal"
          class="tab-btn active"
          role="tab"
          aria-selected="true"
          aria-controls="panel-journal"
        >
          <span>📜</span> Journal & Log
          <span id="badge-journal-count" class="tab-badge">0</span>
        </button>
        <button
          id="tab-btn-kanban"
          class="tab-btn"
          role="tab"
          aria-selected="false"
          aria-controls="panel-kanban"
        >
          <span>📋</span> Kanban Board
          <span id="badge-kanban-count" class="tab-badge">0</span>
        </button>
        <button
          id="tab-btn-meetings"
          class="tab-btn"
          role="tab"
          aria-selected="false"
          aria-controls="panel-meetings"
        >
          <span>🎙️</span> Meeting Notes
          <span id="badge-meetings-count" class="tab-badge">0</span>
        </button>
        <button
          id="tab-btn-review"
          class="tab-btn"
          role="tab"
          aria-selected="false"
          aria-controls="panel-review"
        >
          <span>🚀</span> Performance Review
        </button>
      </nav>

      <!-- Main Viewport: Modular Native Web Components -->
      <main>
        <bb-journal
          id="panel-journal"
          class="tab-panel active"
          role="tabpanel"
          aria-labelledby="tab-btn-journal"
        ></bb-journal>

        <bb-kanban
          id="panel-kanban"
          class="tab-panel"
          role="tabpanel"
          aria-labelledby="tab-btn-kanban"
        ></bb-kanban>

        <bb-meetings
          id="panel-meetings"
          class="tab-panel"
          role="tabpanel"
          aria-labelledby="tab-btn-meetings"
        ></bb-meetings>

        <bb-review
          id="panel-review"
          class="tab-panel"
          role="tabpanel"
          aria-labelledby="tab-btn-review"
        ></bb-review>
      </main>

      <!-- Native Dialogs & Modals Web Component -->
      <bb-modals></bb-modals>
    </div>

    <!-- Core Modular Application Scripts (Zero-Server, Zero-Build) -->
    <script src="js/state.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/metrics.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/journal.js"></script>
    <script src="js/kanban.js"></script>
    <script src="js/meetings.js"></script>
    <script src="js/standup.js"></script>
    <script src="js/review.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/backup.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
